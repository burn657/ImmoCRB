# Espace d'administration ImmoCRB (Decap CMS).
# Connexion avec GitHub, via le fournisseur OAuth de Netlify.
backend:
  name: github
  repo: burn657/ImmoCRB
  branch: main
  commit_messages:
    create: "Ajout de {{collection}} « {{slug}} »"
    update: "Modification de {{collection}} « {{slug}} »"
    delete: "Suppression de {{collection}} « {{slug}} »"
    uploadMedia: "Ajout de l'image « {{path}} »"
    deleteMedia: "Suppression de l'image « {{path}} »"

locale: fr
site_url: /
display_url: /
media_folder: src/images/uploads
public_folder: /images/uploads

collections:
  - name: proprietes
    label: Propriétés
    label_singular: Propriété
    folder: src/proprietes
    create: true
    delete: true
    slug: "{{ville}}-{{titre}}"
    summary: "{{titre}} · {{ville}} · {{statut}}"
    sortable_fields: [date, titre, prix]
    view_filters:
      - { label: À vendre, field: statut, pattern: a_vendre }
      - { label: Vendues, field: statut, pattern: vendu }
      - { label: Achetées, field: statut, pattern: achete }
      - { label: Masquées, field: statut, pattern: masque }
    preview_path: "proprietes/{{slug}}"
    fields:
      - { label: Titre, name: titre, widget: string, hint: "Ex. : Bungalow rénové avec piscine" }
      - label: Statut
        name: statut
        widget: select
        default: a_vendre
        options:
          - { label: À vendre, value: a_vendre }
          - { label: Vendu, value: vendu }
          - { label: Acheté (pour un client acheteur), value: achete }
          - { label: "Masqué (gardé en réserve, invisible sur le site)", value: masque }
      - { label: "En vedette sur l'accueil", name: vedette, widget: boolean, default: false }
      - { label: "Date d'ajout", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Prix ($)", name: prix, widget: number, value_type: int, required: false, hint: "Affiché seulement si la propriété est à vendre. Laissez vide pour « Prix sur demande »." }
      - { label: Adresse, name: adresse, widget: string, required: false, hint: "Affichée seulement si la propriété est à vendre. Pour une propriété vendue ou achetée, seule la ville paraît sur le site." }
      - { label: Ville, name: ville, widget: string }
      - { label: Type, name: type, widget: select, options: [Maison, Condo, Chalet, Plex, Terrain] }
      - { label: Chambres, name: chambres, widget: number, value_type: int, required: false }
      - { label: Salles de bain, name: sdb, widget: number, value_type: int, required: false }
      - { label: Superficie habitable, name: superficie, widget: string, required: false, hint: "Ex. : 1 200 pi²" }
      - { label: Terrain, name: terrain, widget: string, required: false, hint: "Ex. : 6 000 pi²" }
      - { label: Année de construction, name: annee, widget: number, value_type: int, required: false }
      - { label: Numéro Centris, name: centris, widget: string, required: false, hint: "Affiché seulement si la propriété est à vendre" }
      - { label: Photo principale, name: photo_principale, widget: image, required: false, hint: "Sert de vignette dans les listes" }
      - { label: Autres photos, name: photos, widget: list, field: { label: Photo, name: photo, widget: image }, required: false }
      - { label: "Description pour Google (1 à 2 phrases)", name: description, widget: text, required: false, hint: "Texte affiché dans les résultats Google et quand on partage la fiche sur Facebook. Environ 150 caractères. Laissé vide, un texte est créé automatiquement. Ne mettez pas l'adresse d'une propriété vendue ou achetée." }
      - { label: Lien vidéo YouTube, name: video, widget: string, required: false }
      - { label: Description, name: body, widget: markdown }

  - name: reglages
    label: Réglages du site
    editor: { preview: false }
    files:
      - name: site
        label: Mes coordonnées
        file: src/_data/site.json
        fields:
          - { label: Nom du site, name: nom, widget: string }
          - { label: "Adresse du site (ex. https://immocrb.com)", name: url, widget: string }
          - { label: Votre nom, name: courtier, widget: string }
          - { label: Titre, name: titre, widget: string }
          - { label: Agence, name: agence, widget: string }
          - { label: Numéro de permis OACIQ, name: permis, widget: string }
          - { label: Téléphone, name: telephone, widget: string }
          - { label: Courriel, name: courriel, widget: string }
          - { label: Adresse du bureau, name: adresse, widget: string }
          - { label: Région desservie, name: region, widget: string }
          - { label: Votre photo, name: photo, widget: image, required: false }
          - { label: Image de la page d'accueil, name: image_accueil, widget: image, required: false }
          - { label: Texte « À propos » court (page d'accueil), name: apropos, widget: text }
          - { label: Texte « À propos » complet (page À propos), name: apropos_complet, widget: markdown, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
          - { label: Lien Facebook, name: facebook, widget: string, required: false }
          - { label: Lien Instagram, name: instagram, widget: string, required: false }
          - { label: Lien YouTube, name: youtube, widget: string, required: false }
      - name: temoignages
        label: Témoignages
        file: src/_data/temoignages.json
        fields:
          - label: Témoignages
            name: liste
            widget: list
            fields:
              - { label: Texte, name: texte, widget: text }
              - { label: Prénom du client, name: auteur, widget: string }
      - name: taxe
        label: Taxe de bienvenue (tranches)
        file: src/_data/taxe.json
        fields:
          - { label: Année, name: annee, widget: number }
          - { label: Note, name: note, widget: text }
          - label: Tranches
            name: tranches
            widget: list
            fields:
              - { label: "Jusqu'à ($), vide pour la dernière", name: jusqua, widget: number, required: false }
              - { label: "Taux (ex. 0.01 pour 1 %)", name: taux, widget: number, value_type: float }
